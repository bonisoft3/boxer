say:
  lint:
    do: "cargo clippy -- -D warnings && cargo fmt --check"
  # launch must detach, but cargo run is foreground.
  # pitchfork's supervisor doesn't inherit our mise env.
  launch:
    do: '^mise x -- pitchfork run boxer -f -o "health endpoint listening" -- mise x -- cargo run'
  release:
    do: "goreleaser release --snapshot --clean"
  integrate:
    # Skip the depot cache for local buildkit; CI re-enables it via action flags.
    args: "--bake --no-up --no-cache-from --no-cache-to"
